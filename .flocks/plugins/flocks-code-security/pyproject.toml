[project]
name = "flocks-code-security"
version = "0.5.0"
description = "Code security audit plugin with optional Docker validation"
requires-python = ">=3.12,<3.13"
dependencies = ["jsonschema>=4.20.0"]

[project.entry-points."flocks.plugins"]
flocks_code_security = "flocks_code_security.entrypoint:register"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flocks_code_security"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "docker: marks tests that require an explicitly enabled local Docker daemon",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E"]
ignore = ["E501"]
