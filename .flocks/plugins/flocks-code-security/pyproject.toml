[project]
name = "flocks-code-security"
version = "0.4.0"
description = "Static code security audit plugin for Flocks"
requires-python = ">=3.12,<3.13"
dependencies = ["jsonschema>=4.20.0"]

[project.entry-points."flocks.plugins"]
flocks_code_security = "flocks_code_security.entrypoint:register"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flocks_code_security"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E"]
ignore = ["E501"]
