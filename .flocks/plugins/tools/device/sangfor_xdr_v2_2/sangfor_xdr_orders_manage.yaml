name: sangfor_xdr_orders_manage
group: XDR
category: custom
enabled: true
requires_confirmation: true
provider: sangfor_xdr
handler:
  type: script
  script_file: sangfor_xdr.handler.py
  function: run_orders_manage
description_cn: 工单创建。create：发起工单。按 action 选择契约；原生字段使用 api_params，数组请求体使用 api_body。返回原始响应，不裁剪字段。
description: 工单创建。create：发起工单。按 action 选择契约；原生字段使用 api_params，数组请求体使用 api_body。返回原始响应，不裁剪字段。
response_hints: 保留完整 API 响应。各接口响应字段、数据字典及分页说明见交付包 references/document-api.json 和 API-REFERENCE.md；字段值按本接口解释。
inputSchema:
  type: object
  properties:
    action:
      type: string
      enum:
      - create
      description: create：发起工单
    api_params:
      type: object
      properties:
        title:
          type: string
          description: 工单标题；不能包含<>"%&\\特殊字符,并且长度不能超过1000；适用动作：create
        priority:
          type: string
          description: 优先级，默认值：low；文档值参考：low=低优先级；middle=中优先级；high=高优先级；适用动作：create
        processTemplateId:
          type: string
          description: 流程模板ID；根据“查询流程模板列表”接口获取；适用动作：create
        nextAssigneeIds:
          type: array
          description: 下一步责任人ID列表；根据“查询流程模板列表”接口获取；适用动作：create
          items: {}
        nextCopyRecipients:
          type: array
          description: 下一步抄送人ID列表；根据“查询流程模板列表”接口获取；适用动作：create
          items: {}
        content:
          type: string
          description: 工单内容；流程模板中存在富文本或多行文本控件，工单内容会对控件内容进行填充，如果两个控件都存在，则填充富文本控件。；适用动作：create
        businessData:
          type: object
          description: 如果发起流程包含安全事件、安全告警、脆弱性、待审核资产等数据，则该字段为必填项；适用动作：create
          properties:
            type:
              type: string
              description: 业务类型；根据业务数据类型填充不同的枚举值；文档值参考：ALERT=安全告警；INCIDENT=安全事件；VULNERABILITY=脆弱性；REVIEWASSET=待审核资产
            ids:
              type: array
              description: 关联业务ID；支持安全事件、安全告警、脆弱性、待审核资产的业务数据，数量上限为200个
              items: {}
          additionalProperties: false
      additionalProperties: false
      description: 原生请求字段全集。仅传当前 action 支持的字段；运行时严格按该动作的独立契约检查必填、类型和范围。
  required:
  - action
