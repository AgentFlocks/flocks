name: sangfor_xdr_soar
group: XDR
category: custom
enabled: true
requires_confirmation: false
provider: sangfor_xdr
handler:
  type: script
  script_file: sangfor_xdr.handler.py
  function: run_soar
description_cn: SOAR 执行历史。playbook_histories：查看剧本执行历史；action_histories：查看动作执行历史。按 action 选择契约；原生字段使用 api_params，数组请求体使用 api_body。返回原始响应，不裁剪字段。
description: SOAR 执行历史。playbook_histories：查看剧本执行历史；action_histories：查看动作执行历史。按 action 选择契约；原生字段使用 api_params，数组请求体使用 api_body。返回原始响应，不裁剪字段。
response_hints: 保留完整 API 响应。各接口响应字段、数据字典及分页说明见交付包 references/document-api.json 和 API-REFERENCE.md；字段值按本接口解释。
inputSchema:
  type: object
  properties:
    action:
      type: string
      enum:
      - playbook_histories
      - action_histories
      description: playbook_histories：查看剧本执行历史；action_histories：查看动作执行历史
    api_params:
      type: object
      properties:
        page:
          type: integer
          description: 页码，查询第几页的数据；文档值参考：1=默认值：1，默认查询第1页的数据；适用动作：playbook_histories,action_histories
          minimum: 1.0
          maximum: 500.0
        pageSize:
          type: integer
          description: 页大小，每页数据条数；文档值参考：5=默认值：5，默认每页5条数据；适用动作：playbook_histories,action_histories
          minimum: 5.0
          maximum: 500.0
        status:
          type: array
          description: 剧本执行状态；文档值参考：inited=剧本执行状态：初始化；running=剧本执行状态：响应中；failed=剧本执行状态：响应失败；finished=剧本执行状态：响应完成；pending=剧本执行状态：响应中；warning=剧本执行状态：部分成功；canceled=剧本执行状态：取消执行；适用动作：playbook_histories,action_histories
          items: {}
      additionalProperties: false
      description: 原生请求字段全集。仅传当前 action 支持的字段；运行时严格按该动作的独立契约检查必填、类型和范围。
  required:
  - action
