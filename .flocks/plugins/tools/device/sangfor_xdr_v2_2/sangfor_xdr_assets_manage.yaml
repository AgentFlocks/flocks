name: sangfor_xdr_assets_manage
group: XDR
category: custom
enabled: true
requires_confirmation: true
provider: sangfor_xdr
handler:
  type: script
  script_file: sangfor_xdr.handler.py
  function: run_assets_manage
description_cn: 资产写入管理。create_vpc：新增vpc信息；edit：资产列表编辑和批量编辑；delete_adapter：删除资产上报设备；create_source：新增资产数据源；create_adapter：新增资产上报设备；upload：新增资产（上报）；create：新增资产（人工）；ignore_approval：资产审核忽略；approve：资产审核入库；create_user：新增责任人。按
  action 选择契约；原生字段使用 api_params，数组请求体使用 api_body。返回原始响应，不裁剪字段。
description: 资产写入管理。create_vpc：新增vpc信息；edit：资产列表编辑和批量编辑；delete_adapter：删除资产上报设备；create_source：新增资产数据源；create_adapter：新增资产上报设备；upload：新增资产（上报）；create：新增资产（人工）；ignore_approval：资产审核忽略；approve：资产审核入库；create_user：新增责任人。按
  action 选择契约；原生字段使用 api_params，数组请求体使用 api_body。返回原始响应，不裁剪字段。
response_hints: 保留完整 API 响应。各接口响应字段、数据字典及分页说明见交付包 references/document-api.json 和 API-REFERENCE.md；字段值按本接口解释。
inputSchema:
  type: object
  properties:
    action:
      type: string
      enum:
      - create_vpc
      - edit
      - delete_adapter
      - create_source
      - create_adapter
      - upload
      - create
      - ignore_approval
      - approve
      - create_user
      description: create_vpc：新增vpc信息；edit：资产列表编辑和批量编辑；delete_adapter：删除资产上报设备；create_source：新增资产数据源；create_adapter：新增资产上报设备；upload：新增资产（上报）；create：新增资产（人工）；ignore_approval：资产审核忽略；approve：资产审核入库；create_user：新增责任人
    api_params:
      type: object
      properties:
        vpcInfos:
          type: array
          description: 虚拟私有云信息；适用动作：create_vpc
          items:
            type: object
            properties:
              vpcId:
                type: string
                description: 虚拟私有云标识符
              vpcName:
                type: string
                description: 虚拟私有云名称
              isDelete:
                type: boolean
                description: 虚拟私有云是否删除
              vxlanId:
                type: integer
                description: VXLAN环境中标识不同的网络 范围1到16,777,215。
              isManual:
                type: boolean
                description: 是否手动添加
            additionalProperties: false
            required:
            - vpcId
        source:
          type: string
          description: vpc添加来源：“csc”，“device”；适用动作：create_vpc,create_adapter
        assetIds:
          type: array
          description: 资产ID批量查询；过滤参数，默认不传；文档值参考：123=；适用动作：edit,ignore_approval,approve
          items: {}
        ipSegment:
          type: string
          description: IP段信息；过滤参数，默认不传；文档值参考：192.168.0.0/16=；适用动作：edit,ignore_approval,approve
        branchId:
          anyOf:
          - type: number
            description: 资产组id；过滤参数，默认不传；文档值参考：0=；适用动作：edit
          - type: integer
            description: 资产组ID；适用动作：create,ignore_approval
          description: 不同动作类型/约束不同；按 action 对应定义填写。
        classify1Id:
          anyOf:
          - type: array
            description: 资产类型；过滤参数，默认不传，可以通过 /api/xdr/v1/assets/assetclass接口获取可选值；文档值参考：0=未知；1=服务器；2=终端；5=网络设备；6=物联网设备；7=移动设备；8=网络安全产品设备；9=云平台设备；10=企业应用软件设备；适用动作：edit,ignore_approval,approve
            items: {}
          - type: number
            description: 资产一级分类ID；文档值参考：0=未知；1=服务器；2=终端；5=网络设备；6=物联网设备；7=移动设备；8=网络安全产品设备；9=云平台设备；10=企业应用软件设备；适用动作：create
          description: 不同动作类型/约束不同；按 action 对应定义填写。
        connectStatus:
          type: array
          description: 终端接入状态；过滤参数，默认不传；文档值参考：0=离线；1=在线；2=已禁用；3=已卸载；4=未授权；5=已移除；6=已降级；101=未安装；适用动作：edit,ignore_approval,approve
          items: {}
        sourceDevice:
          type: array
          description: 数据源字符串列表；过滤参数，默认不传，可以通过 /api/xdr/v1/assets/sourcedevice接口获取可选值；文档值参考：cwpp=cwpp；edr=edr；sip=sip；yj=云镜；sta=sta；manual=人工；identifier=风险关联；适用动作：edit,ignore_approval,approve
          items: {}
        system:
          type: array
          description: 操作系统；过滤参数，默认不传；文档值参考：Windows=；Linux=；OS X=；iOS=；airOS=；Android=；FreeBSD=；VMware=；Cisco=；MikroTik=；VxWorks=；F5
            Networks=；Unix=；Mac=；Other=；Unknown=；适用动作：edit,ignore_approval,approve
          items: {}
        magnitude:
          type: string
          description: 核心资产；过滤参数，默认不传；文档值参考：normal=普通资产；core=核心资产；适用动作：edit,create,ignore_approval,approve
        tags:
          anyOf:
          - type: array
            description: 标签；过滤参数，默认不传；文档值参考：测试=；适用动作：edit,ignore_approval,approve
            items: {}
          - type: array
            description: 资产标签；最大字符长度20；适用动作：create
            items: {}
            maxItems: 10
          description: 不同动作类型/约束不同；按 action 对应定义填写。
        exposure:
          type: string
          description: 互联网暴露；过滤参数，默认不传；文档值参考：yes=是；no=否；unknown=未知；适用动作：edit,ignore_approval,approve
        isAll:
          type: boolean
          description: 全部资产修改；过滤参数，默认不传；文档值参考：false=不勾选全部资产；true=全部资产；适用动作：edit,ignore_approval,approve
        excludeIds:
          type: array
          description: 排除资产id；过滤参数，默认不传，全部资产修改时，可以取消一些资产修改，与删除资产功能对齐；文档值参考：288=；适用动作：edit,ignore_approval,approve
          items: {}
        searchType:
          type: string
          description: 搜索类型；过滤参数，默认不传；文档值参考：all=全部资产；history=历史资产；current=当前资产，资产管理处显示的资产；wait_approve=待审核资产；适用动作：edit
        editInfo:
          type: object
          description: 编辑的信息；适用动作：edit
          properties:
            assetName:
              type: string
              description: 资产名称（列表编辑传参）
            hostName:
              type: string
              description: 主机名（列表传参）
            classify1Id:
              type: number
              description: 资产一级分类
            classifyId:
              type: number
              description: 资产二级分类
            users:
              type: array
              description: 责任人id列表
              items: {}
            tags:
              type: array
              description: 标签字符串数组
              items: {}
            location:
              type: object
              description: 资产位置（批量编辑传参）
              properties:
                countryId:
                  type: number
                  description: 国家id
                country:
                  type: string
                  description: 国家名称
                provinceId:
                  type: number
                  description: 省份id
                province:
                  type: string
                  description: 省份名称
                cityId:
                  type: number
                  description: 城市id
                city:
                  type: string
                  description: 城市名称
                districtId:
                  type: number
                  description: 区域id
                district:
                  type: string
                  description: 区域名称
                detail:
                  type: string
                  description: 详细信息
              additionalProperties: false
          additionalProperties: false
        updateTimeRange:
          type: string
          description: 最近更新时间范围；过滤参数，默认不传，该字段与updateStartTimestamp和updateEndTimestamp重复，可二选其一进行参数定义。当参数重复时，服务优先解析updateTimeRange字段；文档值参考：30m=表示最近30分钟；1H=表示最近1小时；1d=表示最近1天；1M=表示最近1个月；custom=当timeRange的值为"custom"时，则系统解析startTimestamp字段和endTimestamp字段；；适用动作：edit,ignore_approval,approve
        updateStartTimestamp:
          type: integer
          description: 最近更新时间范围起始时间；过滤参数，默认不传；文档值参考：1680278400=；适用动作：edit,ignore_approval,approve
        updateEndTimestamp:
          type: integer
          description: 最近更新时间范围截止时间；过滤参数，默认不传；文档值参考：1680278400=；适用动作：edit,ignore_approval,approve
        firstTimeRange:
          type: string
          description: 首次发现时间范围；过滤参数，默认不传， 该字段与firstStartTimestamp和firstEndTimestamp重复，可二选其一进行参数定义。当参数重复时，服务优先解析firstTimeRange字段；文档值参考：30m=表示最近30分钟；1H=表示最近1小时；1d=表示最近1天；1M=表示最近1个月；custom=当timeRange的值为"custom"时，则系统解析startTimestamp字段和endTimestamp字段；；适用动作：edit,ignore_approval,approve
        firstStartTimestamp:
          type: integer
          description: 首次发现时间范围起始时间；过滤参数，默认不传；文档值参考：1680278400=；适用动作：edit,ignore_approval,approve
        firstEndTimestamp:
          type: integer
          description: 首次发现时间范围截止时间；过滤参数，默认不传；文档值参考：1680278400=；适用动作：edit,ignore_approval,approve
        ip:
          type: string
          description: IP（模糊搜索，精准搜索）；过滤参数，默认不传；文档值参考：like10.128=模糊搜索ip；=10.128.160.111=精准搜索ip；适用动作：edit,create_adapter,create,ignore_approval,approve
        assetId:
          type: integer
          description: 资产ID（精准搜索）；过滤参数，默认不传；文档值参考：111=；适用动作：edit,ignore_approval,approve
        mac:
          type: string
          description: mac（精准搜索）；过滤参数，默认不传；文档值参考：fe:fc:fe:1f:c9:53=；适用动作：edit,create_adapter,create,ignore_approval,approve
        hostName:
          anyOf:
          - type: string
            description: 主机名（模糊搜索，精准搜索）；过滤参数，默认不传；文档值参考：=admin=精准搜索；likeadmin=模糊搜索；适用动作：edit,ignore_approval,approve
          - type: string
            description: 主机名；适用动作：create
            maxLength: 95
          description: 不同动作类型/约束不同；按 action 对应定义填写。
        name:
          type: string
          description: 资产名称（模糊搜索，精准搜索）；过滤参数，默认不传；文档值参考：=asset=精准搜索；likeasset=模糊搜索；适用动作：edit,create_adapter,ignore_approval,approve,create_user
        username:
          type: string
          description: 责任人（模糊搜索，精准搜索）；过滤参数，默认不传；文档值参考：=username=精准搜索；likeusername=模糊搜索；适用动作：edit,ignore_approval,approve
        ids:
          type: array
          description: 设备ids；适用动作：delete_adapter
          items: {}
        shortName:
          type: string
          description: 数据源简称，简称（1-16个字符）；适用动作：create_source
        longName:
          type: string
          description: 数据源全称，全称（1-40个字符）；适用动作：create_source
        vendor:
          type: string
          description: 厂商；适用动作：create_source
        type:
          anyOf:
          - type: integer
            description: 0：网侧数据源，1：端侧数据源；适用动作：create_source
          - type: string
            description: 操作系统；文档值参考：Unknown=；Windows=；Linux=；OS X=；iOS=；airOS=；Android=；FreeBSD=；VMware=；Cisco=；MikroTik=；VxWorks=；F5
              Networks=；Unix=；Mac=；Other=；适用动作：create
          description: 不同动作类型/约束不同；按 action 对应定义填写。
        belongs:
          type: array
          description: 数据源来源；文档值参考：1=资产数据源；2=脆弱性数据源；适用动作：create_source
          items: {}
          maxItems: 5
        assetName:
          type: string
          description: 资产名称；适用动作：create
          maxLength: 95
        classifyId:
          type: number
          description: 资产分类ID；参考详细说明；适用动作：create
        comment:
          type: string
          description: 资产备注信息；适用动作：create
          minLength: 0
          maxLength: 95
        users:
          type: array
          description: 责任人；适用动作：create
          items:
            type: object
            properties:
              id:
                type: integer
                description: 责任人ID
              name:
                type: string
                description: 责任人名称；文档值参考：""=
              email:
                type: string
                description: 责任人邮箱
              phone:
                type: string
                description: 责任人电话
            additionalProperties: false
        ignoreType:
          type: string
          description: 直接忽略；传参only_ignore；文档值参考：only_ignore=；适用动作：ignore_approval
        approveType:
          type: string
          description: 更新传输类型；列表页单个更新：single   批量更新：bulk  详情里面的审核入库：single_in_detail；文档值参考：single=列表页单个入库；single_in_detail=资产详情页面入库；bulk=列表页批量入库；适用动作：approve
        approveAssetId:
          type: integer
          description: 更新传输id；过滤参数，默认不传，传输当前弹框审核的资产id，对于单个更新，不需要传上面的过滤条件；文档值参考：1=；适用动作：approve
        depName:
          type: string
          description: 部门名称；文档值参考：测试部门名称=；适用动作：create_user
        email:
          type: string
          description: 邮箱；文档值参考：test@ccc.com=；适用动作：create_user
        gid:
          type: integer
          description: 部门ID；文档值参考：2=；适用动作：create_user
        mobile:
          type: string
          description: 电话号码；文档值参考：14233345566=；适用动作：create_user
        position:
          type: string
          description: 职位；文档值参考：test=；适用动作：create_user
        sex:
          type: integer
          description: 性别；文档值参考：1=男；0=女；适用动作：create_user
        coment:
          type: string
          description: 备注；适用动作：create_user
      additionalProperties: false
      description: 原生请求字段全集。仅传当前 action 支持的字段；运行时严格按该动作的独立契约检查必填、类型和范围。
    api_body:
      type: array
      anyOf:
      - type: array
        items:
          type: object
          properties:
            custom:
              type: object
              description: 自定义属性，不定数量子字段的map，同步第三方的自定义字段；key数量限制为30以内，key字符限制为大小写字母和数字，value长度限制256以内
              properties: {}
              additionalProperties: true
            assetId:
              type: string
              description: 资产Id
            taskId:
              type: string
              description: 扫描任务ID
            uploadTimestamp:
              type: number
              description: 发送上传时间戳
            adapter:
              type: object
              description: 适配器信息
              properties:
                sid:
                  type: string
                  description: 适配器唯一Id
                vendor:
                  type: string
                  description: 适配器厂商
                productType:
                  type: string
                  description: 适配器产品类型
                productVer:
                  type: string
                  description: 适配器产品版本
                originSid:
                  type: string
                  description: 原始上报的产品id
                originProductType:
                  type: string
                  description: 原始上报的产品类型；只允许数字、小写字母、下划线、中横线、点、空白符、(、)
                originProductVer:
                  type: string
                  description: 原始上报的产品版本；允许中文、数字、字母、下划线、中横线、点、逗号、空白符、@、(、）
              additionalProperties: false
              required:
              - sid
              - vendor
              - productType
              - productVer
            device:
              type: object
              description: 代表数据产生的最终设备。
              properties:
                hostname:
                  type: string
                  description: 设备主机名；包含LDAP或AD域名或FQDN(Fully Qualified Domain Name)全限定域名，可通过hostname命令获取。英文字符一律小写。 =ecs.host.hostname,rapid7.hostName.name"
                classifyId:
                  type: number
                  description: 设备分类小类；参考《设备分类标准》自动计算分类Id(classifyId)。如果子类ID为0，表示的是整个父类，例如80100表示的“手机”这个类，而80000表示的是“移动设备”这个类。
                classify1Id:
                  type: number
                  description: 设备分类大类；参考《设备分类标准》一级分类Id(classify1Id)。存储这个字段，主要是为了适应频繁的ES聚合查询需求，如果没有类似需求可以删除。
                onlineStatus:
                  type: number
                  description: 设备在线状态；文档值参考：0=离线；1=在线；2=禁用；3=卸载；4=未授权；5=移除；6=已降级
                version:
                  type: string
                  description: 设备的版本；英文字符一律小写
                distribution:
                  type: string
                  description: 设备发行版
                vendor:
                  type: string
                  description: 设备厂商；英文字符一律小写
                standard:
                  type: string
                  description: 设备标准
                detail:
                  type: string
                  description: 设备详情
                number:
                  type: string
                  description: 设备编号
                location:
                  type: string
                  description: 设备位置
                importance:
                  type: number
                  description: 资产重要性；文档值参考：0=
                name:
                  type: string
                  description: 资产名称
                comment:
                  type: string
                  description: 资产备注信息
              additionalProperties: false
              required:
              - hostname
              - classifyId
              - classify1Id
              - onlineStatus
            hardware:
              type: object
              description: 硬件信息
              properties:
                board:
                  type: object
                  description: 主板信息
                  properties:
                    productName:
                      type: string
                      description: 主板产品名称；英文一律小写
                    sn:
                      type: string
                      description: 主板序列号；英文一律小写
                    vendor:
                      type: string
                      description: 主板供应商；英文一律小写
                  additionalProperties: false
                cpu:
                  type: object
                  description: CPU信息
                  properties:
                    deviceModel:
                      type: string
                      description: CPU模型名称；英文一律小写
                    flags:
                      type: string
                      description: CPU标志；英文一律小写
                    frequency:
                      type: number
                      description: CPU兆赫兹（单位MHz）。
                    logicalCores:
                      type: number
                      description: CPU逻辑核数
                    physicalCores:
                      type: number
                      description: CPU物理核数
                    vendor:
                      type: string
                      description: CPU供应商；英文一律小写
                  additionalProperties: false
                  required:
                  - deviceModel
                  - frequency
                disks:
                  type: array
                  description: 磁盘信息
                  items:
                    type: object
                    properties:
                      capacity:
                        type: number
                        description: 磁盘容量(GB)
                      deviceModel:
                        type: string
