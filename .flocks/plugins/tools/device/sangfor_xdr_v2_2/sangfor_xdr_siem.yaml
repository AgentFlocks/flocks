name: sangfor_xdr_siem
group: XDR
category: custom
enabled: true
requires_confirmation: false
provider: sangfor_xdr
handler:
  type: script
  script_file: sangfor_xdr.handler.py
  function: run_siem
description_cn: 关联分析数据源。strategies：数据源列表，提供给自定义报表使用。按 action 选择契约；原生字段使用 api_params，数组请求体使用 api_body。返回原始响应，不裁剪字段。
description: 关联分析数据源。strategies：数据源列表，提供给自定义报表使用。按 action 选择契约；原生字段使用 api_params，数组请求体使用 api_body。返回原始响应，不裁剪字段。
response_hints: 保留完整 API 响应。各接口响应字段、数据字典及分页说明见交付包 references/document-api.json 和 API-REFERENCE.md；字段值按本接口解释。
inputSchema:
  type: object
  properties:
    action:
      type: string
      enum:
      - strategies
      description: strategies：数据源列表，提供给自定义报表使用
    api_params:
      type: object
      properties:
        reportStatus:
          type: array
          description: 数据源上报状态，空则查询所有；适用动作：strategies
          items: {}
        pageSize:
          type: integer
          description: 分页，默认10；适用动作：strategies
          minimum: 1
        page:
          type: integer
          description: 分页，默认1；适用动作：strategies
          minimum: 1
      additionalProperties: false
      description: 原生请求字段全集。仅传当前 action 支持的字段；运行时严格按该动作的独立契约检查必填、类型和范围。
  required:
  - action
