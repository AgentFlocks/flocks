name: sangfor_xdr_alerts
group: XDR
description: 安全告警。list：查询安全告警列表；update_status：批量修改安全告警处置接口；status_list：查询告警处置状态列表；get_proof：根据告警uuId获取举证信息；attck_techniques：查询所有的att&ck信息；branch_stats：境内外受攻击资产查询结果；ip_info：ip信息聚合；ip_info_stats：告警攻击源与受攻击资产组API；aggregation：告警聚合通用API。按
  action 选择契约；原生字段使用 api_params，数组请求体使用 api_body。返回原始响应，不裁剪字段。
description_cn: 安全告警。list：查询安全告警列表；update_status：批量修改安全告警处置接口；status_list：查询告警处置状态列表；get_proof：根据告警uuId获取举证信息；attck_techniques：查询所有的att&ck信息；branch_stats：境内外受攻击资产查询结果；ip_info：ip信息聚合；ip_info_stats：告警攻击源与受攻击资产组API；aggregation：告警聚合通用API。按
  action 选择契约；原生字段使用 api_params，数组请求体使用 api_body。返回原始响应，不裁剪字段。
category: custom
enabled: true
requires_confirmation: false
provider: sangfor_xdr
inputSchema:
  type: object
  properties:
    action:
      type: string
      enum:
      - list
      - update_status
      - status_list
      - get_proof
      - attck_techniques
      - branch_stats
      - ip_info
      - ip_info_stats
      - aggregation
      description: list：查询安全告警列表；update_status：批量修改安全告警处置接口；status_list：查询告警处置状态列表；get_proof：根据告警uuId获取举证信息；attck_techniques：查询所有的att&ck信息；branch_stats：境内外受攻击资产查询结果；ip_info：ip信息聚合；ip_info_stats：告警攻击源与受攻击资产组API；aggregation：告警聚合通用API
    start_time:
      type: integer
      description: '查询起始时间（Unix 秒级时间戳），默认 24 小时前。 也可传 ISO8601 字符串如 "2024-01-01T00:00:00"。

        '
    end_time:
      type: integer
      description: 查询截止时间（Unix 秒级时间戳），默认当前时间。
    page_size:
      type: integer
      description: 每页条数（list 时使用）。
      minimum: 1
    page_num:
      type: integer
      description: 页码，从 1 开始（list 时使用）。
      minimum: 1
    uuid:
      type: string
      description: 路径参数；仅适用于路径包含 uuid 的 action。
    uuids:
      type: array
      description: UUID 列表：用于 list/update_status/status_list；status_list 必须提供非空列表。
      items:
        type: string
    deal_status:
      type: integer
      description: 仅 update_status：1 待处置、2 处置中、3 处置完成。list 使用 deal_statuses 数组。
      enum:
      - 1
      - 2
      - 3
    deal_comment:
      type: string
      description: 处置备注（update_status 时可选）。
    pageNum:
      type: integer
      description: 页码（映射到 page，仅适用定义该字段的 action。）
      minimum: 1
    time_field:
      type: string
      description: 时间字段（映射到 timeField，仅适用定义该字段的 action。）
      enum:
      - firstTime
      - lastTime
      - updateTime
      - dealTime
      - occurTime
      - uploadTime
      - _insertTime
    white_status:
      type: array
      description: 加白状态（映射到 whiteStatus，仅适用定义该字段的 action。）
      items:
        type: string
        enum:
        - 未加白
        - 部分加白
        - 已加白
    deal_statuses:
      type: array
      description: 告警处置状态（映射到 alertDealStatus，仅适用定义该字段的 action。）
      items:
        type: integer
        enum:
        - 1
        - 2
        - 3
    uuId:
      type: string
      description: 路径参数 uuid 的兼容别名。
    api_params:
      type: object
      properties:
        uuIds:
          anyOf:
          - type: array
            description: 告警ID列表；适用动作：list
            items:
              type: string
              minLength: 1
            minItems: 0
            maxItems: 200
          - type: array
            items:
              type: string
              minLength: 1
            minItems: 1
            maxItems: 200
            description: ；适用动作：update_status
          description: 不同动作类型/约束不同；按 action 对应定义填写。
        page:
          type: integer
          description: 页码；适用动作：list
          minimum: 1
        pageSize:
          type: integer
          description: 每页大小；根据pageSize,最多只能查询100000条数据；适用动作：list
          minimum: 1
        startTimestamp:
          type: integer
          description: 开始时间；秒级时间戳，对告警最近发生时间做筛选；适用动作：list,branch_stats,ip_info,ip_info_stats,aggregation
        endTimestamp:
          type: integer
          description: 结束时间；秒级时间戳，对告警最近发生时间做筛选；适用动作：list,branch_stats,ip_info,ip_info_stats,aggregation
        timeField:
          anyOf:
          - type: string
            description: 时间字段；适用动作：list
            enum:
            - firstTime
            - lastTime
            - updateTime
            - dealTime
            - occurTime
            - uploadTime
            - _insertTime
          - type: string
            description: 过滤的时间字段；适用动作：branch_stats,ip_info,ip_info_stats,aggregation
          description: 不同动作类型/约束不同；按 action 对应定义填写。
        sortField:
          type: string
          description: 排序参数；适用动作：list
        alertDealStatus:
          type: array
          description: 告警处置状态；适用动作：list
          items:
            type: integer
            enum:
            - 1
            - 2
            - 3
        sortOrder:
          type: string
          description: 排序类型；适用动作：list
        productType:
          type: array
          description: 告警上报设备产品，不传查全部；适用动作：list
          items: {}
        severities:
          type: array
          description: 告警等级；适用动作：list
          items:
            type: integer
            enum:
            - 0
            - 1
            - 2
            - 3
            - 4
        accessDirections:
          type: array
          description: 访问方向；适用动作：list
          items: {}
        hostBranchId:
          type: array
          description: 资产组；适用动作：list
          items: {}
        platformHostBranchIds:
          type: array
          description: 平台资产组；建议使用 platformHostBranchIds 参数作为 hostBranchId 的升级字段。虽然 hostBranchId 仍可使用，但在平台级联场景中，不同平台的资产组 ID
            可能重复。当两个参数都有值时，将优先使用 platformHostBranchIds。；适用动作：list
          items: {}
        threatDefines:
          type: array
          description: 告警定性；适用动作：list
          items: {}
        read:
          type: boolean
          description: 告警是否已读；适用动作：list
        hostAssetIds:
          type: array
          description: 资产id；适用动作：list
          items: {}
        platformHostAssetIds:
          type: array
          description: 平台资产id；建议使用 platformHostAssetIds参数作为 hostAssetIds的升级字段。虽然 hostAssetIds仍可使用，但在平台级联场景中，不同平台的资产组 ID 可能重复。当两个参数都有值时，将优先使用
            platformHostAssetIds。；适用动作：list
          items: {}
        srcIps:
          type: array
          description: 源Ip；适用动作：list
          items: {}
        dstIps:
          type: array
          description: 目的Ip；适用动作：list
          items: {}
        whiteStatus:
          type: array
          description: 加白状态；适用动作：list
          items:
            type: string
            enum:
            - 未加白
            - 部分加白
            - 已加白
        manages:
          type: array
          description: 上报设备ID；适用动作：list
          items: {}
        devUIds:
          type: array
          description: 数据源-原始；适用动作：list
          items: {}
        platformIds:
          type: array
          description: 平台id；适用动作：list
          items: {}
        alarmClassifications:
          type: array
          description: 告警分类，支持一二三分类组合或单个查询；适用动作：list
          items: {}
        hostGroupIds:
          type: array
          description: 业务组过滤；适用动作：list
          items: {}
        operationLabels:
          type: array
          description: 研判标签；适用动作：list
          items: {}
        gptResult:
          type: array
          description: gpt研判结果；开通GPT授权的用户；适用动作：list
          items: {}
        excludeManages:
          type: array
          description: 上报设备ID；适用动作：list
          items: {}
        filterParam:
          anyOf:
          - type: object
            description: 其他字段过滤；适用动作：list
            properties:
              srcHostCountryName:
                type: array
                description: 攻击源国家
                items: {}
              srcHostProvinceName:
                type: array
                description: 攻击源省份
                items: {}
              dstHostCountryName:
                type: array
                description: 目的国家名称
                items: {}
              dstHostProvinceName:
                type: array
                description: 目的城市名称
                items: {}
            additionalProperties: false
          - type: object
            description: 其他过滤字段；适用动作：branch_stats
            properties:
              srcCountryNames:
                type: array
                description: 过滤国家
                items: {}
              srcIps:
                type: array
                description: 源IP；仅支持IPv4
                items: {}
              srcProvinceName:
                type: array
                description: 省份
                items: {}
              alertDealStatus:
                type: array
                description: 处置状态
                items: {}
            additionalProperties: false
            required:
            - srcCountryNames
          - type: object
            description: 其他过滤字段；适用动作：ip_info
            properties:
              accessDirections:
                type: array
                description: 告警访问方向
                items: {}
              hostBranchIds:
                type: array
                description: 资产组
                items: {}
              severities:
                type: array
                description: 告警等级
                items: {}
              whiteStatus:
                type: array
                description: 加白状态
                items: {}
              devUids:
                type: string
                description: 数据源id
              alarmClassifications:
                type: array
                description: 告警分类，支持一二三分类组合或单个查询
                items: {}
              hostGroupIds:
                type: array
                description: 业务组过滤
                items: {}
              platformIds:
                type: string
                description: 平台id
            additionalProperties: false
          - type: object
            description: 其他过滤字段；适用动作：ip_info_stats
            properties:
              accessDirections:
                type: array
                description: 访问方向；文档值参考：0=无；1=内对外；2=外对内；3=内对内
                items: {}
              srcCountryNames:
                type: array
                description: 攻击源；文档值参考：中国=过滤国家
                items: {}
              dstIps:
                type: array
                description: 目的IP；文档值参考：srcIps=目的IP
                items: {}
            additionalProperties: false
          - type: object
            description: 其他过滤字段；适用动作：aggregation
            properties:
              alertDealStatus:
                type: array
                description: 处置状态；文档值参考：1=待处置；2=处置中；3=处置完成
                items: {}
              accessDirections:
                type: array
                description: 访问方向；文档值参考：0=无；1=内对外；2=外对内；3=内对内
                items: {}
              hostBranchIds:
                type: array
                description: 资产组；文档值参考：[ ]=表示全部
                items: {}
              threatDefines:
                type: array
                description: 告警定性；文档值参考：0=未知威胁；200=业务行为；300=脆弱性风险；400=扫描器攻击；450=疑似定向攻击；500=病毒；900=定向攻击
                items: {}
              hostBusinessIds:
                type: array
                description: 所属业务
                items: {}
              alarmClassifications:
                type: array
                description: 告警分类，支持一二三分类组合或单个查询
                items: {}
              severities:
                type: array
                description: 告警等级；文档值参考：0=信息；1=低危；2=中危；3=高危；4=严重
                items: {}
              read:
                type: boolean
                description: 告警是否已读
              whiteStatus:
                type: array
                description: 告警加白字段；文档值参考：已加白=加白状态为"已加白"的告警；部分加白=加白状态为"部分加白"的告警；未加白=加白状态为"未加白"的告警
                items: {}
              manages:
                type: array
                description: 上报设备ID；文档值参考：SIEM2=筛选上报设备ID为SIEM2的数据；SIEM3=筛选上报设备ID为SIEM3的数据
                items: {}
              devUIds:
                type: array
                description: 数据源-原始
                items: {}
              attackResults:
                type: array
                description: 攻击结果；文档值参考：0=尝试；1=成功；2=失败；3=失陷
                items: {}
              srcCountryNames:
                type: array
                description: 攻击源
                items: {}
              srcProvinceName:
                type: array
                description: 省份
                items: {}
            additionalProperties: false
          description: 不同动作类型/约束不同；按 action 对应定义填写。
        excludeParam:
          anyOf:
          - type: object
            description: 排除条件；适用动作：list
            properties:
              srcHostCountryName:
                type: array
                description: 攻击源国家
                items: {}
              srcHostProvinceName:
                type: array
                description: 攻击源省份
                items: {}
              dstHostCountryName:
                type: array
                description: 目的国家名称
                items: {}
              dstHostProvinceName:
                type: array
                description: 目的城市名称
                items: {}
            additionalProperties: false
          - type: object
            description: 排除条件；适用动作：branch_stats
            properties:
              srcCountryNames:
                type: array
                description: 排除国家
                items: {}
            additionalProperties: false
            required:
            - srcCountryNames
          - type: object
            description: 排除条件；适用动作：ip_info_stats
            properties:
              srcCountryNames:
                type: array
                description: 攻击源；文档值参考：中国=排除国家
                items: {}
            additionalProperties: false
          - type: object
            description: 排除条件；适用动作：aggregation
            properties:
              manages:
                type: array
                description: 上报设备ID；文档值参考：["SIEM4", "SIEM5"]=排除上报设备ID为SIEM4和SIEM5的数据
                items: {}
              srcCountryNames:
                type: array
                description: 攻击源
                items: {}
              proofType:
                type: string
                description: 协议类型
              columns:
                type: array
                description: 不存在某些字段的数据
                items: {}
            additionalProperties: false
          description: 不同动作类型/约束不同；按 action 对应定义填写。
        dealStatus:
          type: integer
          enum:
          - 1
          - 2
          - 3
          description: ；适用动作：update_status
        dealComment:
          type: string
          description: ；适用动作：update_status
        aggFuncs:
          anyOf:
          - type: array
            description: 聚合操作；适用动作：branch_stats
            items:
              type: object
              properties:
                name:
                  type: string
                  description: 聚合结果名称
                func:
                  type: string
                  description: 聚合操作名称；文档值参考：count=统计；cardinality=去重
                param:
                  type: string
                  description: 聚合字段
              additionalProperties: false
              required:
              - name
              - func
              - param
          - type: array
            description: 聚合操作；适用动作：ip_info_stats,aggregation
            items:
              type: object
              properties:
                name:
                  type: string
                  description: 聚合结果名称
                func:
                  type: string
                  description: 聚合操作名称；文档值参考：count=统计；cardinality=去重
                param:
                  type: string
                  description: 聚合字段
              additionalProperties: false
              required:
              - name
              - func
              - param
            maxItems: 10
          description: 不同动作类型/约束不同；按 action 对应定义填写。
        aggBy:
          type: array
          description: 分组字段,参数可以srcIpInfos开头，也可以dstIpInfos开头；适用动作：ip_info,ip_info_stats,aggregation
          items: {}
        limit:
          type: integer
          description: 返回数量；适用动作：ip_info,ip_info_stats,aggregation
        aggByAlias:
          type: array
          description: 分组别名；适用动作：ip_info_stats,aggregation
          items: {}
        sort:
          type: string
          description: 排序方法；这里的排序字段只能是聚合结果名（aggFunc中的name）；文档值参考：name:desc=按告警统计结果降序；name:asc=按告警统计结果升序；适用动作：ip_info_stats,aggregation
      additionalProperties: false
      description: 原生请求字段全集。仅传当前 action 支持的字段；运行时严格按该动作的独立契约检查必填、类型和范围。
    api_body:
      type: array
      anyOf:
      - type: array
        items:
          type: string
          minLength: 1
        minItems: 1
        description: status_list：POST /api/xdr/v1/alerts/dealstatus/list；查询告警处置状态列表
      description: 原生 JSON 数组请求体。alerts.status_list 仍兼容 uuids；资产上报使用对象数组。
  required:
  - action
response_hints: 保留完整 API 响应。各接口响应字段、数据字典及分页说明见交付包 references/document-api.json 和 API-REFERENCE.md；字段值按本接口解释。
handler:
  type: script
  script_file: sangfor_xdr.handler.py
  function: run_alerts
