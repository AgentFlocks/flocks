</style><header><div class="brand"><span class="logo">A</span>Flocks Pro <span class="version">新版本•</span></div><div class="workspace">♧ &nbsp; Agent 工作区 ⌄</div><div class="right">♧　⊙</div></header><aside><div class="nav"><div><span>⌂</span>首页</div><div class="active"><span>⊞</span>Rex 新会话</div><div><span>☷</span>任务中心</div><div><span>♧</span>工作流</div></div><div class="history"><div class="muted">历史会话　　　　　　　　⌕　⊞</div><p>⌄ ▱ AAA</p><p style="padding-left:28px">当前运行环境是</p><div class="muted">未分类</div><p>帮我处理一个安全事件：发现勒索</p><p>1</p><p>1</p><p>test</p><p>新手引导</p><p>新手引导</p><div class="muted">加载更多</div></div><div class="account"><span class="avatar">A</span><div><b>admin</b> <span class="muted">管理员</span><div class="muted">v2026.9.23</div></div></div></aside><main><div class="page-title" id="title">Rex 新会话</div><div class="welcome" id="welcome"><div class="spark">✧</div><h1>开始新的对话</h1><p class="description">AI 原生的安全运营助手，帮您进行威胁分析、应急响应、安全编排等任务</p><div class="shortcuts"><button class="shortcut" data-task="告警运营"><svg class="icon" style="color:#8291a8" viewBox="0 0 24 24"><path d="M12 3 4 6v6c0 5 8 9 8 9s8-4 8-9V6z"/></svg>告警运营</button><button class="shortcut" data-task="威胁狩猎"><svg class="icon" style="color:#f66a47" viewBox="0 0 24 24"><circle cx="10" cy="10" r="7"/><path d="m15 15 6 6"/></svg>威胁狩猎</button><button class="shortcut" data-task="应急响应"><svg class="icon" style="color:#f5a623" viewBox="0 0 24 24"><path d="m12 3 10 18H2zM12 9v5m0 3v.1"/></svg>应急响应</button><button class="shortcut" id="rea"><svg class="icon" style="color:#DC2626" viewBox="0 0 24 24"><path d="M8 3v4m8-4v4M6 7h12v5a6 6 0 0 1-12 0V7zm6 11v4"/></svg>REA 逆向分析<span class="new" id="badge">新</span></button></div></div><section class="conversation" id="conversation" aria-live="polite"></section><div class="composer"><textarea id="input" aria-label="会话消息" placeholder="追问 Agent...（Enter 发送，Shift+Enter 换行）"></textarea><div class="composer-foot"><span>＋</span><span>♧ Build ⌄</span><span>▱ 不在项目中工作 ⌄</span><span>⚙ deepseek-v... ⌄</span><span>♧ 人工审批 ⌄</span><button class="send" id="send" aria-label="发送消息" disabled>↑</button></div></div></main><div class="demo"><span id="demoState">交互演示 · 未安装</span><button id="installedState">切换为已安装</button><button id="home">新会话</button><button id="reset">重置未安装</button></div><script>
const installPrompt="REA 安装指引\n安装原则：仅安装缺失组件；凡可并行执行的操作一律并行，避免串行等待。\n\n一、选择安装档位\n轻量档——仅需 JavaScript / .NET / 压缩包分析时选用，不安装 JDK 与 Ghidra，可节省约 1.2GB 磁盘空间与约 4 分钟安装时间。\n完整档——需反编译原生 ELF / PE 时选用，在轻量档基础上增装 JDK 21 与 Ghidra 12.1.4。\n二、并行安装缺失组件（以下三项应同时执行）\n技能组件：来源为 github:zouineoualid/rea-reverse-engineering/reverse-engineer-anything；该源存在间歇性不可达，安装失败时原样重试。\nJDK 21：执行 dnf install -y java-21-openjdk-devel。\nGhidra 12.1.4：经 https://ghfast.top/ 镜像下载（官方直连速率约 30KB/s，预计耗时 4 小时）；下载后必须校验官方 SHA-256（ddac49f903da9d5bac833e5cc79395098b9c33cfd3279be5f31bd00387d2d4db），校验不通过须丢弃并重新下载；校验通过后解包至 /opt。\n三、MCP 服务仅注册一次\n服务名为 rea，启动命令为 npx -y rea-agents@6.4.0 --mcp（版本必须锁定 6.4.0）；写入环境变量 GHIDRA_INSTALL_DIR=/opt/ghidra_12.1.4_PUBLIC 与 JAVA_HOME=/usr/lib/jvm/java-21-openjdk。轻量档无需写入环境变量。\n不得在安装前后各注册一次，以免产生额外的服务重连开销。\n\n四、执行有效性验证\n按所选安装档位执行真实验证，不得仅以服务启动成功或工具数量（170）作为可用性依据。\n轻量档：不安装 JDK/Ghidra。使用本地生成或来源明确且附源码的最小 JavaScript 文件、.NET 托管程序集和 ZIP 压缩包进行真实工具调用验证，无需用户提供分析材料。JavaScript 和 .NET 样例均包含一个可核对的计算函数及固定输入输出，须通过实际工具还原逻辑，并尽可能在相应运行环境执行核对；ZIP 样例包含已知目录和文件，须通过实际工具列出、提取并核对内容。工具名称以真实 MCP 工具清单为准。逐项报告通过、失败与未完成，不将部分能力通过等同于全部能力可用。\n完整档：先完成轻量档验证，再完成真实原生反编译验证。编译一个约 10 行、包含独立计算函数的 C 程序，依次调用 open_binary 与 procedure_pseudo_code，核对还原逻辑与源码一致，并运行原程序核对固定输入输出。仅确认工具数量（170）不足以证明原生反编译能力可用。\n\n五、其他要求\n组件已存在时应直接复用；/opt/ghidra_* 与 /root/.npm/_npx 为缓存目录，请勿删除——保留缓存可将重复安装耗时由约 6 分钟降至约 30 秒。\n执行系统软件包安装或平台配置写入前，须先取得确认。\n安装执行前请再次和我确认你计划安装哪些模块？";
const usePrompt="帮我使用 REA 逆向工具分析上传的附件文件";
let installed=false;const $=id=>document.getElementById(id);function status(){ $('badge').hidden=installed;$('installedState').disabled=installed;$('installedState').textContent=installed?'已安装（演示）':'切换为已安装';$('demoState').textContent='交互演示 · '+(installed?'已安装':'未安装');}function message(text,type='user'){const m=document.createElement('div');m.className='message '+type;const label=document.createElement('div');label.className='by';label.textContent=type==='user'?'你':'Rex';m.append(label,document.createTextNode(text));$('conversation').append(m);m.scrollIntoView({block:'end'});}function start(){ $('welcome').style.display='none';$('conversation').style.display='block';$('conversation').replaceChildren();$('title').textContent='REA 逆向分析';}function fields(){const box=document.createElement('div');box.className='verify';box.innerHTML='<b>开始逆向分析</b><p>基础验证通过后，请提供分析目标和希望解决的问题。</p><div class="fields"><label>目标文件、下载链接或网站 URL<input id="target" placeholder="例如：https://example.com/app.js"></label><label>希望了解的问题<input id="question" placeholder="例如：登录签名如何生成？"></label></div><button class="primary" id="analyze">发送分析任务</button><p class="muted" id="fieldError">演示不上传文件、不调用实际工具。</p>';$('conversation').append(box);$('analyze').onclick=()=>{let t=$('target').value.trim(),q=$('question').value.trim();if(!t||!q){$('fieldError').textContent='请填写分析目标和希望了解的问题。';$('fieldError').className='error';return;}message(usePrompt.replace('【目标文件、下载链接或网站 URL】',t).replace('【希望了解的问题】',q));message('已演示提交分析任务。实际接入后将检查专项工具、开展分析并核对结果；此原型未执行分析，不生成分析结论。','assistant');};}
function installation(){const box=document.createElement('div');box.className='verify';box.innerHTML='<b>REA 安装与基础验证</b><p>① 检查并复用已有配置</p><p>② 安装技能、工具服务及基础依赖，完成 Flocks 配置</p><p>③ 验证服务启动、工具清单与真实工具调用</p><p class="muted">当前为原型演示，不会实际安装或调用工具。此阶段无需分析材料。</p><div class="actions"><button class="primary" id="complete">模拟基础验证通过</button><button class="secondary" id="fail">模拟验证失败</button></div><p id="result" role="status"></p>';$('conversation').append(box);$('complete').onclick=()=>{installed=true;localStorage.setItem('flocks-rea-quick-demo','ready');status();$('complete').disabled=true;$('fail').disabled=true;$('result').className='success';$('result').textContent='演示状态：基础验证通过。专项能力仍需按分析目标验证。';message('基础验证通过（模拟）。请提供要分析的文件、下载链接或网站 URL，以及希望解决的问题。','assistant');fields();};$('fail').onclick=()=>{$('result').className='error';$('result').textContent='演示状态：工具调用验证失败，尚未确认可用，保留 New 标识。';$('fail').disabled=true;message('工具调用验证失败（模拟）。继续排查服务连接、配置和依赖，修复后重新验证；此时无需提供分析材料。','assistant');$('complete').textContent='模拟修复并验证通过';};}
$('rea').onclick=()=>{$('input').value=installed?usePrompt:installPrompt;$('input').style.height=installed?'54px':'220px';$('send').disabled=false;$('input').focus();$('input').setSelectionRange(0,0);$('input').scrollTop=0;};function home(){ $('welcome').style.display='block';$('conversation').style.display='none';$('title').textContent='Rex 新会话';$('input').value='';$('input').style.height='54px';$('send').disabled=true;status();}$('installedState').onclick=()=>{installed=true;localStorage.setItem('flocks-rea-quick-demo','ready');home();};$('home').onclick=home;$('reset').onclick=()=>{installed=false;localStorage.removeItem('flocks-rea-quick-demo');home();};$('input').oninput=()=>{$('send').disabled=!$('input').value.trim();};function send(){const t=$('input').value.trim();if(!t)return;if($('conversation').style.display!=='block')start();message(t);message('已收到消息（原型演示，未接入实际 Agent）。','assistant');$('input').value='';$('input').style.height='54px';$('send').disabled=true;}$('send').onclick=send;$('input').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}};document.querySelectorAll('[data-task]').forEach(b=>b.onclick=()=>{start();$('title').textContent=b.dataset.task;message('帮我进行'+b.dataset.task);message('此入口仅演示会话跳转。','assistant');});status();
</script></html>
