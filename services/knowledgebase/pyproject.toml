[project]
name = "flocks-knowledgebase"
version = "0.1.0"
description = "Independent Flocks knowledge API backed by RAGFlow"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.135.2",
  "uvicorn==0.42.0",
  "httpx==0.28.1",
  "pydantic==2.12.5",
  "pydantic-settings==2.13.1",
  "python-multipart==0.0.22",
]

[project.optional-dependencies]
dev = ["pytest==9.0.2", "pytest-asyncio==1.3.0", "ruff==0.15.7"]

[project.scripts]
flocks-knowledgebase = "flocks_knowledgebase.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flocks_knowledgebase"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--import-mode=importlib"
markers = ["live: requires an explicitly configured RAGFlow test tenant"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
