name: DSML regression

on:
  pull_request:
    branches: [dev, main]
    paths:
      - 'flocks/session/streaming/**'
      - 'flocks/session/runner.py'
      - '.github/workflows/dsml-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dsml:
    runs-on: ubuntu-latest
    steps:
      - name: Check private test repository access
        env:
          TEST_REPO_TOKEN: ${{ secrets.FLOCKS_AUTOTEST_READ_TOKEN }}
        run: |
          if [ -z "$TEST_REPO_TOKEN" ]; then
            echo '::error::Configure FLOCKS_AUTOTEST_READ_TOKEN with read-only contents access to AgentFlocks/flocks_autotest. Regression tests have NOT run.'
            exit 1
          fi
      - uses: actions/checkout@v6
      - name: Checkout pinned regression tests
        uses: actions/checkout@v6
        with:
          repository: AgentFlocks/flocks_autotest
          ref: 5708b120c9e46720323c4cce822a851fea9bc6e4
          token: ${{ secrets.FLOCKS_AUTOTEST_READ_TOKEN }}
          path: external-autotest
          persist-credentials: false
          sparse-checkout: tests/regression/test_dsml_fallback.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --group dev --frozen
      - name: Run existing and external stream regressions
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          uv run pytest tests/session/test_stream_processor.py
          uv run pytest -c pyproject.toml --confcutdir=external-autotest/tests/regression external-autotest/tests/regression/test_dsml_fallback.py
