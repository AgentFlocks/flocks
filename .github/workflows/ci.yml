name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: flocks_test
          POSTGRES_DB: flocks_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flocks_test -d flocks_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      FLOCKS_TEST_PG_DSN: postgresql://flocks_test@127.0.0.1:5432/flocks_test
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --group dev --frozen

      - name: Read-only development baseline
        run: python3 scripts/dev_baseline.py --require-clean --require-test-pg

      - name: Python lint
        run: uv run ruff check flocks/cli/main.py flocks/cli/service_manager.py

      - name: Validate bundled Hub
        run: uv run python scripts/validate_flockshub.py

      # The public source must not grow new references to a separate commercial
      # build; the baseline only goes down.
      - name: OSS boundary
        run: python3 scripts/oss_boundary_check.py

      - name: Python test
        run: uv run --no-sync pytest tests/scripts tests/hub tests/db

      # Architecture V1.2 guarantees: caller identity, model call ids, workflow
      # code gates, page secrets, pinned UI directory, managed-install CLI and
      # startup declarations. Listed by file until the whole suite runs here.
      - name: Python test (architecture guarantees)
        run: >-
          uv run --no-sync pytest
          tests/session/test_v12_call_identity.py
          tests/workflow/test_v12_workflow_gates.py
          tests/contracts/webui/test_page_api_secrets.py
          tests/server/test_static_webui.py
          tests/plugin/test_v12_readiness_declarations.py
          tests/cli/test_v12_managed_cli.py
          tests/transform/test_response_transform.py


  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webui
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend lint
        run: npm run lint

      - name: Frontend tests
        run: npm run test:run

      - name: Frontend build
        run: npm run build
