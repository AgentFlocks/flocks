name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: flocks_test
          POSTGRES_DB: flocks_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flocks_test -d flocks_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      FLOCKS_TEST_PG_DSN: postgresql://flocks_test@127.0.0.1:5432/flocks_test
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --group dev --frozen

      - name: Read-only development baseline
        run: python3 scripts/dev_baseline.py --require-clean --require-test-pg

      - name: Python lint
        run: uv run ruff check flocks/cli/main.py flocks/cli/service_manager.py

      - name: Validate bundled Hub
        run: uv run python scripts/validate_flockshub.py

      - name: Python test
        run: uv run --no-sync pytest tests/scripts tests/hub tests/net tests/db tests/voice


  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webui
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend lint
        run: npm run lint

      - name: Frontend tests
        run: npm run test:run

      - name: Frontend build
        run: npm run build
